[package]
name = "decision-ledger"
description = "A reviewed ledger of project decisions, put in front of coding agents at edit time"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/WispAgents/decision-ledger"

[[bin]]
name = "decisions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
globset = "0.4"
ast-grep-core = "0.51"
ast-grep-config = "0.51"
ast-grep-language = "0.51"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4

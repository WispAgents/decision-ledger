name: decisions check
description: Fail pull requests whose added lines break accepted decisions in decisions/.
inputs:
  base:
    description: Revision to diff against. Defaults to the pull request base.
    default: ${{ github.event.pull_request.base.sha }}
  version:
    description: Git ref of decision-ledger to install.
    default: main
runs:
  using: composite
  steps:
    - name: Install decisions
      shell: bash
      run: cargo install --locked --git https://github.com/WispAgents/decision-ledger --rev "${{ inputs.version }}" decision-ledger
    - name: Check added lines
      shell: bash
      run: decisions check --diff "${{ inputs.base }}...HEAD" --format github
